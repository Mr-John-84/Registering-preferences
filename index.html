<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل حضور الخدمة</title>
    <style>
        :root {
            --primary-color: #1a365d; /* أزرق كنسي داكن ورسمي */
            --accent-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* الهيدر الاحترافي مع الشعار */
        .header-title {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
        }
       .logo-img {
    width: 100px; /* يمكنك تكبير أو تصغير الحجم من هنا */
    height: auto;
    margin-bottom: 10px;
    object-fit: contain;
}
        .header-title h1 {
            color: var(--primary-color);
            margin: 0 0 6px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-title h3 {
            color: #4a5568;
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        /* التبويبات Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #edf2f7;
            padding: 6px;
            border-radius: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            border: none;
            background: transparent;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        /* حقول البيانات Meta Fields */
        .meta-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .meta-fields label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 700;
            color: #2d3748;
        }
        .meta-fields input {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .meta-fields input:focus {
            border-color: var(--accent-color);
        }

        /* الجدول */
        .table-responsive { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 12px 14px; text-align: right; font-size: 14px; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f7fafc; color: #2d3748; font-weight: 700; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }
        
        select.status-select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-weight: 600;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        select.status-select[data-status="حضور"] { color: #22543d; background-color: #c6f6d5; border-color: #9ae6b4; }
        select.status-select[data-status="غياب"] { color: #742a2a; background-color: #fed7d7; border-color: #feb2b2; }
        select.status-select[data-status="اعتذار"] { color: #744210; background-color: #feebc8; border-color: #fbd38d; }

        .note-input {
            width: 95%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-size: 13px;
            outline: none;
        }
        .note-input:focus { border-color: var(--accent-color); }

        /* زر الإرسال */
        .btn-submit {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.25);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-submit:hover { background: #2b6cb0; }
        .btn-submit:active { transform: scale(0.99); }
        .btn-submit:disabled { background: #a0aec0; cursor: not-allowed; box-shadow: none; }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 20px 10px 5px 10px;
            color: #718096;
            font-size: 12px;
            direction: ltr;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <!-- شعار كنسي رمزي -->
        <img src="logo.png" alt="Logo" class="logo-img">
        <h1>كنيسة مارجرجس بشبين الكوم</h1>
        <h3>خدمة إعدادي بنين</h3>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchClass('grade1')">الصف الأول الإعدادي</button>
        <button class="tab-btn" onclick="switchClass('grade2')">الصف الثاني الإعدادي</button>
        <button class="tab-btn" onclick="switchClass('grade3')">الصف الثالث الإعدادي</button>
    </div>

    <form id="attendanceForm">
        <div class="meta-fields">
            <div>
                <label>تاريخ الجمعة:</label>
                <input type="date" id="attendanceDate" required>
            </div>
            <div>
                <label>موضوع الدرس:</label>
                <input type="text" id="lessonTopic" placeholder="موضوع الدرس" required>
            </div>
            <div>
                <label>خادم الدرس:</label>
                <input type="text" id="servantName" placeholder="اسم الخادم القائم بالدرس" required>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 6%;">م</th>
                        <th style="width: 40%;">اسم المخدوم</th>
                        <th style="width: 22%;">الحالة</th>
                        <th style="width: 32%;">ملاحظات</th>
                    </tr>
                </thead>
                <tbody id="studentsList">
                    <!-- الأسماء تُحمل آلياً -->
                </tbody>
            </table>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">إرسال كشف الفصل للشيت</button>
    </form>
</div>

<footer>
    Design and development John Wagdy 2026
</footer>

<script>
    const classData = {
        grade1: {
            name: "الصف الأول الإعدادي",
            students: [
                "فيلوباتير امونيوس القس غبريال", "متياس الياس اسكندر", "لوكاس الياس اسكندر", 
                "باتريك بولس فتحي فهمي", "كارلوس ويصا القس غبريال", "كاراس هاني سعد", 
                "اندريا فادي عادل صادق", "إيساف ايهاب ابراهيم", "فيلوباتير فادى فرج", 
                "يوسف عاطف خليل", "كاراس كيرلس سعد", "كاراس ريمون", 
                "إيفان نبيل عبد الستار", "بيير ايهاب", "ادم باسم وجيه شكرى", 
                "شفيق عدلي شفيق", "شنودة ايمن عبد الشهيد عبد الملاك", "روبير تامر زخاري"
            ]
        },
        grade2: {
            name: "الصف الثاني الإعدادي",
            students: [
                "باتريك سامح صبحي", "بافلي جورج رفيق", "بولس مينا عاطف", 
                "بولا ايمن ميلاد", "توماس هاني عبدالمسيح", "جاستن جون فريد", 
                "جوني ماهر ألفي", "جوليان جورج فوزي", "ستيفن هاني نبيل", 
                "شنوده سعد مجدي", "فيلوباتير معوض شوقي", "كاراس ريمون ماهر", 
                "كاراس مينا ميخائيل", "كاراس بيتر عماد", "كاراس هاني عبد المسيح", 
                "كيفن مايكل مجدي", "مانويل مينا ناجي", "مارك وائل نادي", 
                "فادي عزمي ميخائيل", "روبير هاني ماهر", "رافائيل القس دانيال", 
                "كيرلس عماد عوض الله"
            ]
        },
        grade3: {
            name: "الصف الثالث الإعدادي",
            students: [
                "ابانوب بيتر ناجي صموئيل", "ستيفن سامر سعيد", "اندرو امير ادوارد جرجس", 
                "توماس ايهاب مجدي رزق", "جوفاني ميلاد وهيب فهمي", "جون فادي موريس فواد", 
                "جيانو سامي سمير كامل", "صموئيل جون سامي", "كيرلس عادل معوض حنا", 
                "مارفن مجدى عبده غبريال", "مارك تامر ميشيل نجيب", "كارلوس بيشوي عبده", 
                "كيرلس امير عادل", "هاني عماد عزيز", "يوسف صفوت غطاس", 
                "انجلو اشرف صبحي", "مينا مدحت مكرم", "ادم ميلاد عبد الملاك"
            ]
        }
    };

    let currentClassKey = 'grade1';
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXf2YzeEDtCh-sdXagCRRMc8RrQoDcEEc2e25kp-EiGq3NF54VqE7HdWuy6M2WBq8Big/exec"; 

    document.getElementById('attendanceDate').valueAsDate = new Date();

    function switchClass(classKey) {
        currentClassKey = classKey;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (classKey === 'grade1' && idx === 0) || 
                                           (classKey === 'grade2' && idx === 1) || 
                                           (classKey === 'grade3' && idx === 2));
        });
        renderStudents();
    }

    function renderStudents() {
        const tbody = document.getElementById('studentsList');
        tbody.innerHTML = '';
        const students = classData[currentClassKey].students;

        students.forEach((name, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${name}</strong></td>
                <td>
                    <select class="status-select" data-name="${name}" data-status="غياب" onchange="this.setAttribute('data-status', this.value)">
                        <option value="حضور">حضور</option>
                        <option value="غياب" selected>غياب</option>
                        <option value="اعتذار">اعتذار</option>
                    </select>
                </td>
                <td><input type="text" class="note-input" data-name="${name}" placeholder="ملاحظات..."></td>
            `;
            tbody.appendChild(row);
        });
    }

    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "جاري إرسال البيانات...";

        const selectedDate = document.getElementById('attendanceDate').value;
        const lessonTopic = document.getElementById('lessonTopic').value;
        const servantName = document.getElementById('servantName').value;
        const className = classData[currentClassKey].name;

        const records = [];
        const statusSelects = document.querySelectorAll('.status-select');
        
        statusSelects.forEach(select => {
            const name = select.getAttribute('data-name');
            const status = select.value;
            const noteInput = document.querySelector(`.note-input[data-name="${name}"]`);
            const notes = noteInput ? noteInput.value : '';

            records.push({
                name: name,
                status: status,
                notes: notes
            });
        });

        const payload = {
            className: className,
            selectedDate: selectedDate,
            lessonTopic: lessonTopic,
            servantName: servantName,
            records: records
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert(`تم تسجيل كشف (${className}) بنجاح!`);
            btn.disabled = false;
            btn.innerText = "إرسال كشف الفصل للشيت";
        })
        .catch(err => {
            alert("حدث خطأ أثناء الإرسال.");
            btn.disabled = false;
            btn.innerText = "إرسال كشف الفصل للشيت";
        });
    });

    renderStudents();
</script>

</body>
</html>
